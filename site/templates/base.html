<!doctype html>
<html lang="{{ lang }}" data-sablona="casopis">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>{% block titul %}{{ t.titul }}{% endblock %}</title>
<meta name="description" content="{% block popis %}{{ t.podtitul }}{% endblock %}">
<script>try{var s=localStorage.getItem("sablona");if(s==="casopis"||s==="pruvodce")document.documentElement.setAttribute("data-sablona",s);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap">
<link rel="stylesheet" href="{{ root }}static/leaflet.css">
<link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
{% if nahled %}<div class="ukazka">{{ t.ukazka }}</div>{% endif %}
<header class="lista">
  <div class="obal">
    <a class="logo" href="{{ root }}index.html">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 17 C9 9, 14 15, 20 7" fill="none" stroke="var(--signal)" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="17" r="2" fill="currentColor"/><circle cx="20" cy="7" r="2" fill="currentColor"/></svg>
      {{ t.titul }}
    </a>
    <nav>
      <span class="prepinac" role="group" aria-label="{{ t.sablona }}">
        <button type="button" data-nastav="casopis" id="sablona-casopis">{{ t.casopis }}</button>
        <button type="button" data-nastav="pruvodce" id="sablona-pruvodce">{{ t.pruvodce }}</button>
      </span>
      <a href="{{ jazyk_url }}" hreflang="{{ t.jazyk_kod }}" lang="{{ t.jazyk_kod }}">{{ t.jazyk }}</a>
    </nav>
  </div>
</header>
{% block obsah %}{% endblock %}
<footer class="paticka"><div class="obal">{{ t.paticka }}</div></footer>
<script src="{{ root }}static/leaflet.js"></script>
<script src="{{ root }}static/topojson-client.min.js"></script>
<script>window.DENIK = {root: {{ root|tojson }}, lang: {{ lang|tojson }}, mody: {{ t.mody|tojson }}, zavrit: {{ t.zavrit|tojson }}};</script>
<script src="{{ root }}static/app.js"></script>
{% block skript %}{% endblock %}
</body>
</html>
